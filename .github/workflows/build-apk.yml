name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_id:        { required: true, type: string }
      app_name:        { required: true, type: string }
      package_id:      { required: true, type: string }
      version_name:    { required: true, type: string }
      version_code:    { required: true, type: string }
      callback_url:    { required: true, type: string }
      files_url:       { required: true, type: string }
      webhook_secret:  { required: true, type: string }

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BUILD_ID:       ${{ inputs.build_id }}
      APP_NAME:       ${{ inputs.app_name }}
      PACKAGE_ID:     ${{ inputs.package_id }}
      VERSION_NAME:   ${{ inputs.version_name }}
      VERSION_CODE:   ${{ inputs.version_code }}
      CALLBACK_URL:   ${{ inputs.callback_url }}
      FILES_URL:      ${{ inputs.files_url }}
      WEBHOOK_SECRET: ${{ inputs.webhook_secret }}
      RUN_URL:        ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Checkout template
        uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Mark queued done
        run: ./scripts/notify.sh step_done queued "Runner started"
        shell: bash

      - name: Notify checkout
        run: ./scripts/notify.sh step_done checkout

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: template/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Inject project files
        run: |
          ./scripts/notify.sh step_start inject "Downloading project snapshot"
          node scripts/inject-files.js
          ./scripts/notify.sh step_done inject

      - name: Install dependencies
        working-directory: template
        run: |
          ../scripts/notify.sh step_start install
          npm ci || npm install
          ../scripts/notify.sh step_done install

      - name: Build web bundle
        working-directory: template
        run: |
          ../scripts/notify.sh step_start web_build
          npm run build
          ../scripts/notify.sh step_done web_build

      - name: Capacitor add android + sync
        working-directory: template
        run: |
          ../scripts/notify.sh step_start cap_sync
          npx cap add android || true
          npx cap sync android
          node ../scripts/patch-android.js
          ../scripts/notify.sh step_done cap_sync

      - name: Gradle assembleRelease (unsigned)
        working-directory: template/android
        run: |
          ../../scripts/notify.sh step_start gradle
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
          ../../scripts/notify.sh step_done gradle

      - name: Locate APK
        id: apk
        run: |
          APK=$(find template/android/app/build/outputs/apk -name "*.apk" | head -n1)
          echo "APK path: $APK"
          if [ -z "$APK" ]; then echo "No APK produced"; exit 1; fi
          SIZE=$(stat -c%s "$APK")
          NEW="$APP_NAME-$BUILD_ID.apk"
          cp "$APK" "$NEW"
          echo "apk_path=$NEW" >> "$GITHUB_OUTPUT"
          echo "apk_size=$SIZE" >> "$GITHUB_OUTPUT"

      - name: Upload to GitHub Release
        id: release
        run: |
          ./scripts/notify.sh step_start upload
          TAG="build-$BUILD_ID"
          gh release create "$TAG" "${{ steps.apk.outputs.apk_path }}" \
            --title "$APP_NAME ($BUILD_ID)" \
            --notes "Automated APK build for $APP_NAME ($PACKAGE_ID v$VERSION_NAME)"
          URL=$(gh release view "$TAG" --json assets -q ".assets[0].url")
          echo "download_url=$URL" >> "$GITHUB_OUTPUT"
          ./scripts/notify.sh step_done upload "$URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify build done
        run: |
          curl -fsS -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "x-build-secret: $WEBHOOK_SECRET" \
            -d "$(jq -nc \
              --arg id "$BUILD_ID" \
              --arg url "${{ steps.release.outputs.download_url }}" \
              --arg run_id "${{ github.run_id }}" \
              --arg run_url "$RUN_URL" \
              --argjson size ${{ steps.apk.outputs.apk_size }} \
              --arg secret "$WEBHOOK_SECRET" \
              '{event:"build_done", build_id:$id, download_url:$url, file_size_bytes:$size, github_run_id:$run_id, github_run_url:$run_url, secret:$secret}')"

      - name: Notify failure
        if: failure()
        run: |
          curl -fsS -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "x-build-secret: $WEBHOOK_SECRET" \
            -d "$(jq -nc \
              --arg id "$BUILD_ID" \
              --arg msg "Build failed. See GitHub run logs." \
              --arg run_id "${{ github.run_id }}" \
              --arg run_url "$RUN_URL" \
              --arg secret "$WEBHOOK_SECRET" \
              '{event:"build_failed", build_id:$id, error_message:$msg, github_run_id:$run_id, github_run_url:$run_url, secret:$secret}')" || true
